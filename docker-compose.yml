services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 5000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - generated_prisma:/app/generated/prisma
    command: ['sh', '-c', 'pnpm exec prisma migrate deploy && pnpm dev']

volumes:
  node_modules:
  generated_prisma:
